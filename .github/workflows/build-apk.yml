name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/twa-manifest.json'
      - 'manifest.json'
      - 'icon-512.png'
      - 'icon-512-maskable.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (JDK/SDK paths, non-interactive)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/android.keystore

      - name: Generate TWA Android project from twa-manifest.json
        run: bubblewrap update --directory android --manifest android/twa-manifest.json --skipVersionUpgrade

      - name: Build and sign APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - name: Rename output APK
        run: cp android/app-release-signed.apk workout-tracker.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: workout-tracker.apk

      - name: Publish/update GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest)
          body: >
            Автоматически собранный APK трекера тренировок для Android.
            Скачайте workout-tracker.apk и установите (потребуется разрешить
            установку из неизвестных источников).
          files: workout-tracker.apk
          prerelease: false
