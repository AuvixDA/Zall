<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Трекер тренировок</title>
  <meta name="description" content="Личный трекер тренировок: упражнения, веса, история и аналитика прогресса.">
  <meta name="theme-color" content="#12141a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-texture" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-plates" aria-hidden="true">
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="16"/><circle cx="100" cy="100" r="40" fill="none" stroke="currentColor" stroke-width="10"/></svg>
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="16"/><circle cx="100" cy="100" r="40" fill="none" stroke="currentColor" stroke-width="10"/></svg>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <svg class="header-icon" viewBox="0 0 64 24" fill="none">
        <rect x="1" y="6" width="6" height="12" rx="1.5" fill="currentColor"/>
        <rect x="8" y="3" width="4" height="18" rx="1.5" fill="currentColor"/>
        <rect x="13" y="10" width="38" height="4" rx="2" fill="currentColor"/>
        <rect x="52" y="3" width="4" height="18" rx="1.5" fill="currentColor"/>
        <rect x="57" y="6" width="6" height="12" rx="1.5" fill="currentColor"/>
      </svg>
      <h1>Трекер тренировок</h1>
    </div>
  </header>

  <main class="app-main">
    <section id="panel-log" class="tab-panel active"></section>
    <section id="panel-library" class="tab-panel"></section>
    <section id="panel-history" class="tab-panel"></section>
    <section id="panel-analytics" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="log">
      <span class="nav-icon">📝</span>
      <span>Сегодня</span>
    </button>
    <button class="nav-btn" data-tab="library">
      <span class="nav-icon">🏋️</span>
      <span>Упражнения</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <span class="nav-icon">📅</span>
      <span>История</span>
    </button>
    <button class="nav-btn" data-tab="analytics">
      <span class="nav-icon">📈</span>
      <span>Аналитика</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
