<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Трекер тренировок</title>
  <meta name="description" content="Личный трекер тренировок: упражнения, веса, история и аналитика прогресса.">
  <meta name="theme-color" content="#12141a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-texture" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-posters" aria-hidden="true">
    <div class="poster poster-1">
      <svg viewBox="0 0 100 150" fill="currentColor">
        <circle cx="50" cy="15" r="11"/>
        <rect x="44" y="23" width="12" height="9" rx="2"/>
        <path d="M30,32 C38,27 62,27 70,32 C74,42 70,52 63,58 C70,63 74,75 70,84 C62,90 38,90 30,84 C26,75 30,63 37,58 C30,52 26,42 30,32 Z"/>
        <ellipse cx="26" cy="49" rx="9.5" ry="19" transform="rotate(-22 26 49)"/>
        <ellipse cx="20" cy="25" rx="7.5" ry="16" transform="rotate(18 20 25)"/>
        <circle cx="23" cy="14" r="8.5"/>
        <ellipse cx="74" cy="49" rx="9.5" ry="19" transform="rotate(22 74 49)"/>
        <ellipse cx="80" cy="25" rx="7.5" ry="16" transform="rotate(-18 80 25)"/>
        <circle cx="77" cy="14" r="8.5"/>
        <rect x="34" y="88" width="13" height="52" rx="6"/>
        <rect x="53" y="88" width="13" height="52" rx="6"/>
      </svg>
      <div class="poster-caption">Iron Legends</div>
    </div>
    <div class="poster poster-2">
      <svg viewBox="0 0 100 150" fill="currentColor">
        <circle cx="50" cy="15" r="11"/>
        <rect x="44" y="23" width="12" height="9" rx="2"/>
        <path d="M30,32 C38,27 62,27 70,32 C74,42 70,52 63,58 C70,63 74,75 70,84 C62,90 38,90 30,84 C26,75 30,63 37,58 C30,52 26,42 30,32 Z"/>
        <ellipse cx="26" cy="49" rx="9.5" ry="19" transform="rotate(-22 26 49)"/>
        <ellipse cx="20" cy="25" rx="7.5" ry="16" transform="rotate(18 20 25)"/>
        <circle cx="23" cy="14" r="8.5"/>
        <ellipse cx="74" cy="49" rx="9.5" ry="19" transform="rotate(22 74 49)"/>
        <ellipse cx="80" cy="25" rx="7.5" ry="16" transform="rotate(-18 80 25)"/>
        <circle cx="77" cy="14" r="8.5"/>
        <rect x="34" y="88" width="13" height="52" rx="6"/>
        <rect x="53" y="88" width="13" height="52" rx="6"/>
      </svg>
      <div class="poster-caption">Est. Strength</div>
    </div>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <svg class="header-icon" viewBox="0 0 64 24" fill="none">
        <rect x="1" y="6" width="6" height="12" rx="1.5" fill="currentColor"/>
        <rect x="8" y="3" width="4" height="18" rx="1.5" fill="currentColor"/>
        <rect x="13" y="10" width="38" height="4" rx="2" fill="currentColor"/>
        <rect x="52" y="3" width="4" height="18" rx="1.5" fill="currentColor"/>
        <rect x="57" y="6" width="6" height="12" rx="1.5" fill="currentColor"/>
      </svg>
      <h1>Трекер тренировок</h1>
      <button class="header-tools-btn" id="tools-btn" aria-label="Данные и инструменты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3.09 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="modal-overlay" id="tools-modal" hidden>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>Данные и инструменты</h2>
        <button class="icon-btn" id="tools-close-btn" aria-label="Закрыть">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>

      <div class="section-title">Резервная копия</div>
      <p class="modal-hint">Все данные хранятся только в этом браузере. Сохраните файл, чтобы не потерять историю при очистке кэша или смене устройства.</p>
      <button class="btn-secondary" id="export-data-btn">Экспортировать в файл</button>
      <button class="btn-secondary" id="import-data-btn">Импортировать из файла</button>
      <input type="file" id="import-file-input" accept="application/json" hidden>

      <div class="section-title">Калькулятор блинов</div>
      <div class="calc-row">
        <div class="set-field">
          <label>Целевой вес, кг</label>
          <input type="number" id="plate-target" inputmode="decimal" step="0.5" min="0" placeholder="100">
        </div>
        <div class="set-field">
          <label>Вес грифа, кг</label>
          <input type="number" id="plate-bar" inputmode="decimal" step="0.5" min="0" value="20">
        </div>
      </div>
      <div id="plate-result" class="calc-result"></div>

      <div class="section-title">Калькулятор 1ПМ</div>
      <div class="calc-row">
        <div class="set-field">
          <label>Вес, кг</label>
          <input type="number" id="orm-weight" inputmode="decimal" step="0.5" min="0" placeholder="80">
        </div>
        <div class="set-field">
          <label>Повторы</label>
          <input type="number" id="orm-reps" inputmode="numeric" step="1" min="1" placeholder="8">
        </div>
      </div>
      <div id="orm-result" class="calc-result"></div>
    </div>
  </div>

  <main class="app-main">
    <section id="panel-log" class="tab-panel active"></section>
    <section id="panel-library" class="tab-panel"></section>
    <section id="panel-history" class="tab-panel"></section>
    <section id="panel-analytics" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="log">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="4" width="14" height="17" rx="2"/>
          <rect x="9" y="2" width="6" height="4" rx="1" fill="currentColor" stroke="none"/>
          <path d="M8.5 13l2.5 2.5 5-5"/>
        </svg>
      </span>
      <span>Сегодня</span>
    </button>
    <button class="nav-btn" data-tab="library">
      <span class="nav-icon">
        <svg viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="6" width="3.2" height="8" rx="1.2"/>
          <rect x="23.8" y="6" width="3.2" height="8" rx="1.2"/>
          <rect x="5.5" y="3.5" width="2.4" height="13" rx="1.2"/>
          <rect x="20" y="3.5" width="2.4" height="13" rx="1.2"/>
          <line x1="8" y1="10" x2="20" y2="10"/>
        </svg>
      </span>
      <span>Упражнения</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <line x1="3" y1="9.5" x2="21" y2="9.5"/>
          <line x1="8" y1="3" x2="8" y2="7"/>
          <line x1="16" y1="3" x2="16" y2="7"/>
          <line x1="7" y1="13.5" x2="9" y2="13.5"/>
          <line x1="11.5" y1="13.5" x2="13.5" y2="13.5"/>
          <line x1="16" y1="13.5" x2="18" y2="13.5"/>
          <line x1="7" y1="17.5" x2="9" y2="17.5"/>
          <line x1="11.5" y1="17.5" x2="13.5" y2="17.5"/>
        </svg>
      </span>
      <span>История</span>
    </button>
    <button class="nav-btn" data-tab="analytics">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="10.5" y1="21" x2="10.5" y2="9"/>
          <line x1="17" y1="21" x2="17" y2="5"/>
          <path d="M3 12.5l5.5-5 4 3.5L20 3" stroke-width="1.8"/>
          <path d="M15.5 3H20v4.5"/>
        </svg>
      </span>
      <span>Аналитика</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
